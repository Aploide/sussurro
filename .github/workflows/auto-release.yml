name: Auto Draft Release

on:
  push:
    branches:
      - master
      - main
    paths:
      - internal/version/version.go
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        shell: bash
        run: |
          set -euo pipefail

          current="$(sed -nE 's/^const Version = "([^"]+)"/\1/p' internal/version/version.go | head -n1)"
          if [[ -z "${current}" ]]; then
            echo "Could not read version from internal/version/version.go" >&2
            exit 1
          fi

          normalized="${current#v}"
          should_release="false"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            should_release="true"
          else
            before="${{ github.event.before }}"
            if [[ -z "${before}" || "${before}" == "0000000000000000000000000000000000000000" ]]; then
              should_release="true"
            else
              previous="$(git show "${before}:internal/version/version.go" 2>/dev/null | sed -nE 's/^const Version = "([^"]+)"/\1/p' | head -n1 || true)"
              previous="${previous#v}"
              if [[ -z "${previous}" || "${previous}" != "${normalized}" ]]; then
                should_release="true"
              fi
            fi
          fi

          echo "should_release=${should_release}" >> "$GITHUB_OUTPUT"
          echo "version=${normalized}" >> "$GITHUB_OUTPUT"
          echo "tag=v${normalized}" >> "$GITHUB_OUTPUT"

  build-assets:
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: amd64
          - os: macos-14
            platform: macos
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev libgtk-layer-shell-dev

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          chmod +x scripts/package-release.sh scripts/package-transcribe.sh
          make build build-transcribe
          ./scripts/package-release.sh "${{ needs.detect-version.outputs.version }}" "${{ matrix.platform }}" "${{ matrix.arch }}"
          cp "release/sussurro-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" dist/
          cp "release/sussurro-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz.sha256" dist/
          ./scripts/package-transcribe.sh "${{ needs.detect-version.outputs.version }}" "${{ matrix.platform }}" "${{ matrix.arch }}"
          cp "release/sussurro-transcribe-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" dist/
          cp "release/sussurro-transcribe-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz.sha256" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: sussurro-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/sussurro-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
            dist/sussurro-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz.sha256
            dist/sussurro-transcribe-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
            dist/sussurro-transcribe-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz.sha256

  draft-release:
    needs:
      - detect-version
      - build-assets
    if: needs.detect-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Ensure release tag exists
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ needs.detect-version.outputs.tag }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = `tags/${tag}`;

            try {
              await github.rest.git.getRef({ owner, repo, ref });
              core.info(`Tag ${tag} already exists.`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha
              });
              core.info(`Created tag ${tag} at ${context.sha}.`);
            }

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect-version.outputs.tag }}
          name: Sussurro ${{ needs.detect-version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
